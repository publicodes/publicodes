name: Build Website Docker Image
on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - '1.x'

permissions:
  packages: write

jobs:
  build-compiler:
    name: Build, publish, and deploy website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the tag version
        id: build-version
        run: |
          head="${{ github.ref_name }}"
          case "$head" in
            "master"|"1.x")
              printf %s "$head"
              ;;
            *)
              printf preview
              ;;
          esac | xargs -0 printf 'version=%s' >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/website:${{ steps.build-version.outputs.version }}
      - name: Map the Dokploy application id
        id: map-application
        run: |
          case "${{ github.ref_name }}" in
            "master")
              printf a3JQoOpbyJuKAsm8_nzmb
              ;;
            "1.x")
              printf nzvvdzvZK3FpyYW9Zm6zT
              ;;
            *)
              printf 9g0loPbIM7Q_FhertdZJq
              ;;
          esac | xargs -r0 printf 'application_id=%s' >> "$GITHUB_OUTPUT"
      - name: Dokploy Deployment
        if: steps.map-application.outputs.application_id
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          api_token: ${{ secrets.DOKPLOY_API_KEY }}
          application_id: ${{ steps.map-application.outputs.application_id }}
          dokploy_url: https://dokploy.calinou.coop
          service_type: application
