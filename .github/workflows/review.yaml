name: Build Website Docker Image
on: [push]

permissions:
  packages: write

jobs:
  build-compiler:
    name: Build and publish review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the tag version
        id: build-version
        run: |
          head="${{ github.ref_name }}"
          case "$head" in
            "master"|"1.x")
              printf %s "$head"
              ;;
            *)
              printf review-%s "$head" | tr '/' '-'
              ;;
          esac | xargs -0 printf 'version=%s' >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/website:${{ steps.build-version.outputs.version }}
