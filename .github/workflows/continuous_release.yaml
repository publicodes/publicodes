name: Continuous release
on: [pull_request]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-compiler:
    name: Ocaml compiler (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # https://github.com/actions/runner-images
        include:
          - name: linux x64
            platform: ubuntu-latest
            cli: linux-x64
          - name: linux arm64
            platform: ubuntu-24.04-arm
            cli: linux-arm64
          - name: macos x64
            platform: macos-26-intel
            cli: darwin-x64
          - name: macos arm64
            platform: macos-26
            cli: darwin-arm64
          - name: windows x64
            platform: windows-latest
            cli: win32-x64
          # not supported by opam
          #- name: windows arm64
          #  platform: windows-11-arm
          #  cli: win32-arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the ocaml compiler
        uses: ./.github/actions/build-compiler
        with:
          platform: ${{ matrix.platform }}
          cli: ${{ matrix.cli }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: build-compiler
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-node
      - uses: actions/download-artifact@v8
        with:
          pattern: publicodes-cli-*
          merge-multiple: true
      - name: Untar builds artifacts
        run: find . -name '*.tar.gz' -maxdepth 1 -exec tar -xvf {} \;
      - run: yarn build
      - name: Continuously Release
        run: npx pkg-pr-new publish './packages/*'

  test:
    name: Tests
    needs: build-compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install node
        uses: ./.github/actions/install-node
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Yarn tests
        run: yarn run test
