name: Install
inputs:
  node-version:
    description: 'Node.js version'
    default: 22.x
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - run: npm install -g pnpm@
      shell: bash
    - run: pnpm install --frozen-lockfile
      shell: bash
